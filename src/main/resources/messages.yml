# VoidVault Messages
# Format: MiniMessage markup (https://docs.advntr.dev/minimessage/format.html)
# Supports <gradient:#9CC3FF:#D9B3FF>...</gradient>, <hover>, <click>,
# <bold>, <italic>, etc. Legacy & codes are still translated automatically.
#
# Colour palette (sky blue → lavender):
#   Sky Blue   : #9CC3FF
#   Lavender   : #D9B3FF
#   Deep Sky   : #6FA8FF
#   Soft Violet: #B89BE8
#   Slate      : #8C8FA3
#   Whisper    : #D6DAEA
#
# Placeholders are documented per message.

# Brand prefix shown on every chat message.
prefix: "<gradient:#9CC3FF:#D9B3FF>✦ VoidVault</gradient> <dark_gray>»</dark_gray> "

# Command messages
commands:
  reload-success: "{prefix}<green>Configuration reloaded.</green> <gray>Welcome back to a freshly tuned vault.</gray>"
  open-other: "{prefix}<gray>Opening</gray> <gradient:#9CC3FF:#D9B3FF><bold>{player}</bold></gradient><gray>'s vault…</gray>"
  open-other-page: "{prefix}<gray>Opening</gray> <gradient:#9CC3FF:#D9B3FF><bold>{player}</bold></gradient><gray>'s vault · Page </gray><gradient:#9CC3FF:#D9B3FF><bold>{page}</bold></gradient>"
  setslots-success: "{prefix}<gray>Slots for</gray> <gradient:#9CC3FF:#D9B3FF><bold>{player}</bold></gradient> <gray>set to</gray> <gradient:#9CC3FF:#D9B3FF><bold>{amount}</bold></gradient>"
  setpages-success: "{prefix}<gray>Pages for</gray> <gradient:#9CC3FF:#D9B3FF><bold>{player}</bold></gradient> <gray>set to</gray> <gradient:#9CC3FF:#D9B3FF><bold>{amount}</bold></gradient>"
  no-permission: "{prefix}<red>You don't have permission to do that.</red> <gray>Ask an admin if you think this is a mistake.</gray>"
  player-only: "{prefix}<red>This command can only be used in-game by a player.</red>"
  player-not-found: "{prefix}<red>Player</red> <gradient:#9CC3FF:#D9B3FF><bold>{player}</bold></gradient> <red>was not found on this server.</red>"
  player-not-online: "{prefix}<red>Player</red> <gradient:#9CC3FF:#D9B3FF><bold>{player}</bold></gradient> <red>is not online.</red>"
  invalid-number: "{prefix}<red>Invalid number:</red> <gradient:#9CC3FF:#D9B3FF><bold>{input}</bold></gradient>"
  invalid-page: "{prefix}<red>Invalid page:</red> <gradient:#9CC3FF:#D9B3FF><bold>{page}</bold></gradient> <gray>(allowed 1–{max})</gray>"
  usage-open: "{prefix}<gray>Usage:</gray> <gradient:#9CC3FF:#D9B3FF>/voidvault open <player> [page]</gradient>"
  usage-setslots: "{prefix}<gray>Usage:</gray> <gradient:#9CC3FF:#D9B3FF>/voidvault setslots <player> <amount></gradient>"
  usage-setpages: "{prefix}<gray>Usage:</gray> <gradient:#9CC3FF:#D9B3FF>/voidvault setpages <player> <amount></gradient> <dark_gray>(1–{max})</dark_gray>"
  usage-main: "{prefix}<gradient:#9CC3FF:#D9B3FF>VoidVault Commands</gradient>"

# Remote access messages
remote-access:
  on-cooldown: "{prefix}<red>Please wait</red> <gradient:#9CC3FF:#D9B3FF><bold>{seconds}s</bold></gradient> <red>before using this again.</red>"
  disabled: "{prefix}<red>Remote vault access is currently disabled.</red>"
  page-out-of-range: "{prefix}<red>Page</red> <gradient:#9CC3FF:#D9B3FF><bold>{page}</bold></gradient> <red>is out of range. You can access up to</red> <gradient:#9CC3FF:#D9B3FF><bold>{max}</bold></gradient> <red>page(s).</red>"
  usage-remote: "{prefix}<gray>Usage:</gray> <gradient:#9CC3FF:#D9B3FF>/echest [page]</gradient>"

# Vault operation messages
vault:
  opening: "{prefix}<gradient:#9CC3FF:#D9B3FF>✦</gradient> <gray>Opening your vault…</gray>"
  page-changed: "{prefix}<gradient:#9CC3FF:#D9B3FF>✦</gradient> <gray>Now viewing page</gray> <gradient:#9CC3FF:#D9B3FF><bold>{page}</bold></gradient> <gray>of</gray> <gradient:#9CC3FF:#D9B3FF><bold>{max}</bold></gradient>"
  sorted: "{prefix}<gradient:#9CC3FF:#D9B3FF>✦</gradient> <gray>Your vault has been sorted by category.</gray>"
  deposited: "{prefix}<gradient:#9CC3FF:#D9B3FF>✦</gradient> <gray>Deposited</gray> <gradient:#9CC3FF:#D9B3FF><bold>{count}</bold></gradient> <gray>item(s) into the vault.</gray>"
  no-items-to-deposit: "{prefix}<red>No matching items to deposit.</red>"
  page-locked: "{prefix}<red>You don't have permission to access this page.</red> <gray>Ask an admin to upgrade your rank.</gray>"
  slot-locked: "{prefix}<red>This slot is locked.</red> <gray>Upgrade your vault to unlock it.</gray>"
  search-prompt: "{prefix}<gray>Type the item name to search for (or</gray> <gradient:#9CC3FF:#D9B3FF>cancel</gradient> <gray>to exit):</gray>"
  search-prompt-raw: "{prefix}<gray>Type your search query in chat (or</gray> <gradient:#9CC3FF:#D9B3FF>cancel</gradient> <gray>to exit).</gray>"
  search-starting: "{prefix}<gradient:#9CC3FF:#D9B3FF>✦</gradient> <gray>Filtering your vault for</gray> <gradient:#9CC3FF:#D9B3FF><bold>{query}</bold></gradient><gray>…</gray>"
  search-active: "{prefix}<gray>Filtering items matching:</gray> <gradient:#9CC3FF:#D9B3FF><bold>{query}</bold></gradient>"
  search-cancelled: "{prefix}<gray>Search cancelled.</gray>"
  search-cleared: "{prefix}<gradient:#9CC3FF:#D9B3FF>✦</gradient> <gray>Search filter cleared.</gray>"
  no-matching-items: "{prefix}<red>No items found matching:</red> <gradient:#9CC3FF:#D9B3FF><bold>{query}</bold></gradient>"

# Error messages
error:
  load-failed: "{prefix}<red>Failed to load your vault.</red> <gray>Please contact an administrator.</gray>"
  save-failed: "{prefix}<red>Failed to save your vault.</red> <gray>Please try again in a moment.</gray>"
  generic: "{prefix}<red>Something went wrong.</red> <gray>Please contact an administrator.</gray>"
  invalid-mode: "{prefix}<red>Invalid plugin mode in configuration.</red>"
  database-error: "{prefix}<red>Database connection error.</red> <gray>Please contact an administrator.</gray>"
  data-corrupted: "{prefix}<red>Your vault data appears to be corrupted.</red> <gray>An empty vault was loaded as fallback.</gray>"

# Admin messages
admin:
  data-saved: "{prefix}<gray>Saved data for</gray> <gradient:#9CC3FF:#D9B3FF><bold>{count}</bold></gradient> <gray>players.</gray>"
  migration-started: "{prefix}<gray>Starting data migration from</gray> <gradient:#9CC3FF:#D9B3FF><bold>{from}</bold></gradient> <gray>to</gray> <gradient:#9CC3FF:#D9B3FF><bold>{to}</bold></gradient><gray>…</gray>"
  migration-complete: "{prefix}<gradient:#9CC3FF:#D9B3FF>✦</gradient> <gray>Migration complete. Migrated</gray> <gradient:#9CC3FF:#D9B3FF><bold>{count}</bold></gradient> <gray>players.</gray>"
  migration-failed: "{prefix}<red>Migration failed:</red> <gray>{error}</gray>"
  backup-created: "{prefix}<gray>Backup created:</gray> <gradient:#9CC3FF:#D9B3FF><bold>{file}</bold></gradient>"

# GUI titles (rendered via MiniMessage)
gui:
  simple-vault: "<gradient:#9CC3FF:#D9B3FF><bold>✦ Vault</bold></gradient>"
  paged-vault: "<gradient:#9CC3FF:#D9B3FF><bold>✦ VoidVault</bold></gradient> <dark_gray>·</dark_gray> <gray>Page {page}/{max_pages}</gray>"
  shulker-preview: "<gradient:#9CC3FF:#D9B3FF><bold>Shulker Box Preview</bold></gradient>"
  admin-vault: "<gradient:#9CC3FF:#D9B3FF><bold>✦ {target}'s Vault</bold></gradient> <dark_gray>·</dark_gray> <gray>Page {page}/{max_pages}</gray>"